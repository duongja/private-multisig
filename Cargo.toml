[workspace]
members = [
    "crates/private_multisig_core",
    "crates/private_multisig_cli",
    "crates/private_multisig_program",
    "crates/private_multisig_runner",
    "methods",
    "methods/guest",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/duongja/lp-0002-private-multisig"

[workspace.dependencies]
anyhow = "1.0"
borsh = { version = "1.7", features = ["derive"] }
clap = { version = "4.5.42", features = ["derive"] }
common = { path = "../logos-execution-zone-v0.2.0-testnet/lez/common" }
hex = "0.4"
lee = { path = "../logos-execution-zone-v0.2.0-testnet/lee/state_machine" }
lee_core = { path = "../logos-execution-zone-v0.2.0-testnet/lee/state_machine/core" }
private_multisig_core = { path = "crates/private_multisig_core" }
private_multisig_methods = { path = "methods" }
private_multisig_program = { path = "crates/private_multisig_program" }
rand = "0.8"
risc0-build = "3.0.5"
risc0-zkvm = { version = "3.0.5", features = ["std"] }
sequencer_service_rpc = { path = "../logos-execution-zone-v0.2.0-testnet/lez/sequencer/service/rpc", features = ["client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
